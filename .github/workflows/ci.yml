name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sgms
          POSTGRES_PASSWORD: sgms
          POSTGRES_DB: sgms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sgms:sgms@localhost:5432/sgms?schema=public
      AUTH_SECRET: ci-placeholder-secret-not-for-production
      AUTH_URL: http://localhost:3100
      NEXTAUTH_URL: http://localhost:3100
      CLOUD_API_BASE_URL: https://cloud.cicibyte.com/api
      CLOUD_PRODUCT_SLUG: sgms
      CLOUD_API_KEY: ci-placeholder-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sgms/database db:generate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run migrations against CI database
        # 20260715130000/20260715210000: iki tarihi migration, 2026-06-30'da production'da
        # yaşanmış BİR KEZLİK bir manuel-kurtarma olayını düzeltiyor (bkz. migration.sql
        # yorumları) — o olay hiç yaşanmamış TERTEMİZ bir veritabanında (CI'nınki gibi)
        # replay edilemezler. Üretimde zaten uygulanmış olan bu dosyaları checksum
        # uyuşmazlığı riskiyle değiştirmek yerine, yalnızca CI'da "resolve --applied" ile
        # atlanıyor. Normal deploy başarısız olursa (beklenen: tertemiz DB) bu iki
        # migration'ı çözüp yeniden dener; gerçek bir migration hatasında yine başarısız olur.
        run: |
          pnpm --filter @sgms/database exec prisma migrate deploy || {
            echo "İlk deploy başarısız — bilinen tarihi migration'lar çözülüp yeniden deneniyor..."
            pnpm --filter @sgms/database exec prisma migrate resolve --applied 20260715130000_fix_expense_status_enum_case
            pnpm --filter @sgms/database exec prisma migrate resolve --applied 20260715210000_fix_expense_status_enum_values
            pnpm --filter @sgms/database exec prisma migrate deploy
          }

      - name: Seed demo data (e2e fixtures)
        run: pnpm --filter @sgms/database db:seed

      - name: Unit tests
        run: pnpm test

      - name: Build web app
        run: pnpm web:build

      - name: Install Playwright browsers
        run: pnpm --filter @sgms/web exec playwright install --with-deps chromium

      - name: E2E tests
        env:
          CI: true
        run: pnpm --filter @sgms/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
