# SGMS — Next.js reverse proxy (aaPanel extension snippet)
# Hedef dosya (VDS):
#   /www/server/panel/vhost/nginx/extension/sgms.cicibyte.com/next-proxy.conf
#
# Kurulum:
#   sudo cp docs/deployment/nginx/next-proxy.conf \
#     /www/server/panel/vhost/nginx/extension/sgms.cicibyte.com/next-proxy.conf
#   sudo nginx -t && sudo nginx -s reload
#
# NOT: license.cicibyte.com vhost'una DOKUNMAYIN.

# Next.js build statikleri — Nginx doğrudan servis eder (immutable cache)
location ^~ /_next/static/ {
    alias /www/wwwroot/sgms.cicibyte.com/apps/web/.next/static/;
    expires 365d;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Public statik dosyalar (favicon, logo vb.)
location ^~ /public/ {
    alias /www/wwwroot/sgms.cicibyte.com/apps/web/public/;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
}

# Next.js image optimizer
location ^~ /_next/image {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Uygulama — Node.js (PM2) reverse proxy
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
}
